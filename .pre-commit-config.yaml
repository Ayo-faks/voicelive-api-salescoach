# Pathfinder Learn — pre-commit hooks.
# Install once: `pip install pre-commit && pre-commit install`.
#
# The grounding-contract lint is a local hook (not pinned to a remote repo)
# because it lives in this repo and has no third-party dependencies.

repos:
  - repo: local
    hooks:
      - id: lint-explanations-have-provenance
        name: ExplanationResult must carry wiki_citations (MVP §4.1)
        entry: python scripts/lint_explanations_have_provenance.py
        language: system
        types: [python]
        files: ^backend/src/
        pass_filenames: false
