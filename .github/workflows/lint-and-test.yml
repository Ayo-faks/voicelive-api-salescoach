name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main
      - 'refactor/pathfinder-learn-phase-*'

jobs:
  python-test:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Lint Python code
      working-directory: ./backend
      run: |
        echo "Running flake8..."
        flake8 . --config=.flake8

    - name: Check Python code formatting
      working-directory: ./backend
      run: |
        echo "Checking black formatting..."
        black . --check --config pyproject.toml

    - name: Run Python tests
      working-directory: ./backend
      env:
        PYTHONPATH: src:src/services
      run: |
        python -m pytest -v

  agent-eval-gate:
    # Blocking agent-eval gate: grades the committed real-agent eval report
    # through the same thresholds the observability gate uses and fails the
    # pipeline on a hard `blocked` (e.g. a critical safeguarding false negative).
    # Credential-free and offline by design — the live A2/A5 re-run stays a
    # manual, unsandboxed step (see backend/scripts/all-agent-eval-handoff.prompt.md).
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run blocking agent-eval gate
      working-directory: ./backend
      run: |
        echo "Grading committed real-agent eval report (fail on hard block)..."
        python scripts/ci_eval_gate.py --force

  frontend-test:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install Node.js dependencies
      working-directory: ./frontend
      run: |
        npm install

    - name: Lint TypeScript code
      working-directory: ./frontend
      run: |
        echo "Running ESLint..."
        npm run lint

    - name: Check TypeScript code formatting
      working-directory: ./frontend
      run: |
        echo "Checking prettier formatting..."
        npm run format:check

    - name: Build TypeScript
      working-directory: ./frontend
      run: |
        npm run build

  phase-2-contract:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install Python dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Install Playwright Chromium
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium

    - name: Run Phase 2 architecture contract gate
      run: make verify-phase-2 PYTHON=python

  phase-3-contract:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install Python dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Install frontend dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Install Playwright Chromium
      working-directory: ./frontend
      run: npx playwright install --with-deps chromium

    - name: Run Phase 3 architecture contract gate
      run: make verify-phase-3 PYTHON=python

  phase-4-contract:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Python dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-test.txt

    - name: Run Phase 4 architecture contract gate
      run: make verify-phase-4 PYTHON=python
